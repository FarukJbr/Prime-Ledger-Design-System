<style>
  .page-hero{padding:72px 0 56px;text-align:center;position:relative;overflow:hidden}
  .page-hero .blob{position:absolute;inset-inline:0;top:-30%;height:120%;background:radial-gradient(circle at 50% 30%,rgba(0,84,168,.12),transparent 60%);pointer-events:none}
  .page-hero h1{margin:14px auto 16px;max-width:760px}
  .page-hero .lead{max-width:600px;margin:0 auto}
  .svc-block{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center;padding:56px 0;border-bottom:1px solid var(--border);scroll-margin-top:90px}
  .svc-block:nth-child(even) .svc-visual{order:-1}
  .svc-block .icon-chip{width:60px;height:60px;border-radius:var(--r-lg)}
  .svc-block .icon-chip svg{width:30px;height:30px}
  .svc-block h2{font-family:var(--font-display);font-size:32px;font-weight:700;margin:20px 0 14px}
  .svc-block .lead{margin:0 0 22px}
  .svc-incl{display:flex;flex-direction:column;gap:11px;margin:0 0 24px;padding:0;list-style:none}
  .svc-incl li{display:flex;align-items:flex-start;gap:11px;font-size:15.5px;color:var(--ink-2)}
  .svc-incl li svg{width:20px;height:20px;color:var(--success);flex-shrink:0;margin-top:2px}
  .svc-visual{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);box-shadow:var(--shadow-md);padding:30px;min-height:280px;display:flex;flex-direction:column;justify-content:center;gap:14px;position:relative;overflow:hidden}
  .svc-visual.dark{background:var(--grad-ink);color:#fff;border:none}
  .vrow{display:flex;align-items:center;gap:13px;padding:14px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--paper)}
  .vrow b{font-size:15px}.vrow small{font-size:12.5px;color:var(--ink-3)}
  @media(max-width:880px){.svc-block{grid-template-columns:1fr;gap:28px;padding:44px 0}.svc-block:nth-child(even) .svc-visual{order:0}}
</style>
