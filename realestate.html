<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>נוף נדל"ן · נכסים למכירה</title>
<link rel="icon" href="../assets/logo-mark.png">
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
  *{box-sizing:border-box;margin:0}
  :root{--blue:#1C5BB8;--blue-d:#16498f;--ink:#16202E;--bg:#F5F7FA;--line:#E2E8F0}
  body{font-family:'Assistant',sans-serif;background:var(--bg);color:var(--ink);direction:rtl;line-height:1.5}
  a{color:inherit;text-decoration:none}img{display:block;max-width:100%}
  .pl-ribbon{background:#16181F;color:#fff;font-size:12.5px;text-align:center;padding:9px}
  .pl-ribbon a{color:#93A2FF;font-weight:700}
  .nav{position:sticky;top:0;z-index:40;background:#fff;border-bottom:1px solid var(--line)}
  .nav-in{max-width:1180px;margin:0 auto;padding:0 28px;height:72px;display:flex;align-items:center;gap:24px}
  .logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:21px;color:var(--blue)}
  .logo .m{width:32px;height:32px;background:var(--blue);border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff}
  .logo .m svg{width:19px;height:19px}
  .nav-links{display:flex;gap:22px;margin-inline-start:auto;font-weight:600;font-size:15px;color:#475569}
  .nav-links a:hover{color:var(--blue)}
  .btn{background:var(--blue);color:#fff;font-weight:700;padding:11px 22px;border-radius:10px;border:none;cursor:pointer;font-family:'Assistant';font-size:15px;display:inline-flex;gap:8px;align-items:center}
  .btn:hover{background:var(--blue-d)}
  .hero{position:relative;background:linear-gradient(rgba(22,32,46,.55),rgba(22,32,46,.7)),url('https://images.unsplash.com/photo-1560518883-ce09059eeffa?w=1600&q=80') center/cover;color:#fff}
  .hero-in{max-width:1180px;margin:0 auto;padding:80px 28px 100px}
  .hero .kick{font-weight:700;letter-spacing:.16em;font-size:13px;text-transform:uppercase;color:#9DC0F0}
  .hero h1{font-family:'Frank Ruhl Libre';font-weight:900;font-size:clamp(40px,5.6vw,64px);line-height:1.05;margin:14px 0;max-width:640px}
  .hero p{font-size:19px;opacity:.92;max-width:440px;margin-bottom:0}
  /* search bar */
  .search{max-width:1100px;margin:-46px auto 0;background:#fff;border-radius:16px;box-shadow:0 24px 50px -20px rgba(22,32,46,.35);padding:18px;display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:12px;position:relative;z-index:5}
  .search .f label{font-size:12px;font-weight:700;color:#94a3b8;display:block;margin-bottom:5px}
  .search .f select,.search .f input{width:100%;font-family:'Assistant';font-size:15px;padding:10px 12px;border:1.5px solid var(--line);border-radius:9px;color:var(--ink);background:#fff}
  .search .btn{align-self:flex-end;height:43px}
  .sec{max-width:1180px;margin:0 auto;padding:70px 28px 90px}
  .sec-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:30px}
  .sec-head h2{font-family:'Frank Ruhl Libre';font-weight:900;font-size:36px}
  .filters{display:flex;gap:8px}
  .filters button{font-family:'Assistant';font-weight:600;font-size:14px;border:1.5px solid var(--line);background:#fff;cursor:pointer;padding:8px 16px;border-radius:999px;color:#475569}
  .filters button.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .listings{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
  .prop{background:#fff;border-radius:16px;overflow:hidden;border:1px solid var(--line);transition:.25s}
  .prop:hover{box-shadow:0 20px 44px -18px rgba(22,32,46,.3);transform:translateY(-3px)}
  .prop .pimg{aspect-ratio:16/11;position:relative;overflow:hidden}
  .prop .pimg img{width:100%;height:100%;object-fit:cover}
  .prop .badge{position:absolute;top:12px;inset-inline-start:12px;background:#fff;color:var(--blue);font-size:12px;font-weight:800;padding:5px 11px;border-radius:999px}
  .prop .fav{position:absolute;top:12px;inset-inline-end:12px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.9);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--blue)}
  .prop .fav svg{width:17px;height:17px}
  .prop .pb{padding:18px}
  .prop .price{font-family:'Frank Ruhl Libre';font-weight:900;font-size:26px;color:var(--ink)}
  .prop h3{font-size:17px;font-weight:700;margin:6px 0 4px}
  .prop .loc{color:#94a3b8;font-size:14px;display:flex;align-items:center;gap:5px}
  .prop .loc svg{width:14px;height:14px}
  .prop .specs{display:flex;gap:16px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line);color:#475569;font-size:14px;font-weight:600}
  .prop .specs span{display:flex;align-items:center;gap:6px}
  .prop .specs svg{width:16px;height:16px;color:var(--blue)}
  .foot{background:var(--ink);color:rgba(255,255,255,.65);text-align:center;padding:40px 28px;font-size:14px}
  @media(max-width:880px){.nav-links{display:none}.search{grid-template-columns:1fr 1fr}.listings{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="pl-ribbon">אתר זה נבנה על־ידי <a href="../index.html">Prime Ledger ←</a> · דוגמה להמחשה</div>

<nav class="nav"><div class="nav-in">
  <span class="logo"><span class="m"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg></span>נוף נדל"ן</span>
  <div class="nav-links"><a href="#listings">נכסים</a><a href="#">מכירה</a><a href="#">השכרה</a><a href="#">צור קשר</a></div>
  <a class="btn" href="#">השאירו פרטים</a>
</div></nav>

<header class="hero"><div class="hero-in">
  <span class="kick">סוכנות הנדל"ן שלכם</span>
  <h1>הבית הבא שלכם מתחיל כאן.</h1>
  <p>מאות נכסים נבחרים, ליווי אישי ושקיפות מלאה — מהחיפוש ועד המפתח.</p>
</div></header>

<div class="search">
  <div class="f"><label>עיר / אזור</label><select><option>הכול</option><option>תל אביב</option><option>הרצליה</option><option>רמת גן</option><option>ירושלים</option></select></div>
  <div class="f"><label>חדרים</label><select><option>הכול</option><option>2+</option><option>3+</option><option>4+</option><option>5+</option></select></div>
  <div class="f"><label>תקציב עד</label><select><option>ללא הגבלה</option><option>₪2M</option><option>₪3.5M</option><option>₪5M</option></select></div>
  <button class="btn" onclick="alert('מחפש נכסים מתאימים...')"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>חיפוש</button>
</div>

<section class="sec" id="listings">
  <div class="sec-head"><h2>נכסים מומלצים</h2>
    <div class="filters"><button class="on">הכול</button><button>למכירה</button><button>להשכרה</button></div>
  </div>
  <div class="listings" id="grid"></div>
</section>

<footer class="foot">© 2026 נוף נדל"ן · רישיון תיווך 12345 · 03-555-0144</footer>

<script>
const heart='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7Z"/></svg>';
const bed='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 4v16M2 8h18a2 2 0 0 1 2 2v10M2 17h20M6 8V6a2 2 0 0 1 2-2h8"/></svg>';
const area='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M3 9h18"/></svg>';
const PROPS=[
  {price:'₪3,250,000',t:'דירת גן מרווחת',loc:'הרצליה פיתוח',r:4,m:120,tag:'למכירה',img:'https://images.unsplash.com/photo-1568605114967-8130f3a36994?w=700&q=80'},
  {price:'₪2,180,000',t:'דירה משופצת במרכז',loc:'תל אביב',r:3,m:85,tag:'למכירה',img:'https://images.unsplash.com/photo-1512917774080-9991f1c4c750?w=700&q=80'},
  {price:'₪8,500/חודש',t:'פנטהאוז עם נוף',loc:'רמת גן',r:5,m:160,tag:'להשכרה',img:'https://images.unsplash.com/photo-1493809842364-78817add7ffb?w=700&q=80'},
  {price:'₪4,100,000',t:'בית פרטי עם גינה',loc:'כפר סבא',r:6,m:240,tag:'למכירה',img:'https://images.unsplash.com/photo-1583608205776-bfd35f0d9f83?w=700&q=80'},
  {price:'₪1,850,000',t:'דירת 2 חדרים מודרנית',loc:'ירושלים',r:2,m:62,tag:'למכירה',img:'https://images.unsplash.com/photo-1502672260266-1c1ef2d93688?w=700&q=80'},
  {price:'₪6,200/חודש',t:'סטודיו מעוצב',loc:'תל אביב',r:1,m:45,tag:'להשכרה',img:'https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?w=700&q=80'},
];
document.getElementById('grid').innerHTML=PROPS.map(p=>`
  <div class="prop"><div class="pimg"><span class="badge">${p.tag}</span><button class="fav" onclick="this.style.color=this.style.color==='rgb(220, 59, 63)'?'':'#DA3B3F'">${heart}</button><img src="${p.img}" alt=""></div>
    <div class="pb"><div class="price">${p.price}</div><h3>${p.t}</h3>
      <div class="loc"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>${p.loc}</div>
      <div class="specs"><span>${bed} ${p.r} חד'</span><span>${area} ${p.m} מ"ר</span></div>
    </div></div>`).join('');
</script>
</body>
</html>
