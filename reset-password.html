<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>שינוי סיסמה · Prime Ledger</title>
<link rel="icon" href="assets/logo-mark.png">
<link rel="stylesheet" href="site.css">
<style>
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--paper);padding:24px}
  .rp-card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);box-shadow:var(--shadow-lg);padding:38px 34px}
  .rp-brand{display:flex;align-items:center;gap:10px;margin-bottom:22px}
  .rp-brand b{font-family:var(--font-display);font-weight:900;font-size:20px}
  .rp-card h1{font-family:var(--font-display);font-weight:900;font-size:26px;margin:0 0 8px}
  .rp-card .sub{color:var(--ink-3);margin:0 0 24px;font-size:15px;line-height:1.5}
  .fld{margin-bottom:16px}
  .fld label{display:block;font-size:14px;font-weight:600;color:var(--ink-2);margin-bottom:7px}
  .fld .inp{display:flex;align-items:center;gap:10px;border:1.5px solid var(--border-strong);border-radius:var(--r-md);padding:0 14px;background:var(--surface);transition:all var(--dur)}
  .fld .inp:focus-within{border-color:var(--brand-500);box-shadow:var(--ring-brand)}
  .fld .inp svg{width:18px;height:18px;color:var(--ink-4)}
  .fld .inp input{flex:1;border:none;background:none;font-family:var(--font-sans);font-size:15px;padding:12px 0;outline:none;color:var(--ink)}
  .fld .inp .toggle{background:none;border:none;cursor:pointer;color:var(--ink-4);padding:4px}
  .msg{display:none;align-items:center;gap:9px;font-size:14px;font-weight:600;padding:12px 14px;border-radius:var(--r-md);margin-bottom:18px;line-height:1.45}
  .msg svg{width:18px;height:18px;flex-shrink:0}
  .msg.err{display:flex;background:var(--danger-bg);color:var(--danger);border:1px solid color-mix(in oklab,var(--danger) 30%,transparent)}
  .msg.ok{display:flex;background:var(--success-bg);color:var(--success);border:1px solid color-mix(in oklab,var(--success) 30%,transparent)}
  .msg.info{display:flex;background:var(--brand-50);color:var(--brand-700);border:1px solid color-mix(in oklab,var(--brand-500) 25%,transparent)}
  .back{text-align:center;margin-top:22px;font-size:14px}
  .back a{color:var(--brand-600);font-weight:700}
  .hide{display:none!important}
</style>
</head>
<body>
<div class="rp-card">
  <a class="rp-brand brand" href="index.html"><span class="logo-mark" style="width:36px;height:32px"></span><b>Prime Ledger Solutions</b></a>
  <h1>בחירת סיסמה חדשה</h1>
  <p class="sub" id="subText">הזינו סיסמה חדשה לחשבון שלכם.</p>

  <div class="msg" id="msg"></div>

  <form id="rpForm" onsubmit="doUpdate(event)">
    <div class="fld">
      <label>סיסמה חדשה</label>
      <div class="inp"><i data-lucide="lock"></i><input type="password" id="pw1" placeholder="לפחות 6 תווים" minlength="6" required><button type="button" class="toggle" onclick="togglePw('pw1',this)"><i data-lucide="eye"></i></button></div>
    </div>
    <div class="fld">
      <label>אימות סיסמה</label>
      <div class="inp"><i data-lucide="lock"></i><input type="password" id="pw2" placeholder="הקלדה חוזרת" minlength="6" required></div>
    </div>
    <button class="btn btn-primary btn-block btn-lg" type="submit" id="rpBtn">שמירת סיסמה <i data-lucide="check"></i></button>
  </form>

  <div class="back"><a href="login.html">חזרה לכניסה</a></div>
</div>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="config.js"></script>
<script src="backend.js"></script>
<script>
  lucide.createIcons();
  var msgEl = document.getElementById('msg');
  function showMsg(text, kind){ msgEl.className='msg '+(kind||'err'); msgEl.innerHTML='<i data-lucide="'+(kind==='ok'?'check-circle-2':(kind==='info'?'info':'alert-circle'))+'"></i><span>'+text+'</span>'; lucide.createIcons(); }
  function togglePw(id, btn){ var p=document.getElementById(id); p.type=p.type==='password'?'text':'password'; }

  async function doUpdate(e){
    e.preventDefault();
    var pw1=document.getElementById('pw1').value, pw2=document.getElementById('pw2').value;
    if(pw1!==pw2){ showMsg('הסיסמאות אינן תואמות.'); return; }
    var btn=document.getElementById('rpBtn'); btn.disabled=true;
    var B=await window.PLBackend.ready;
    try{
      await B.auth.updatePassword(pw1);
      showMsg('הסיסמה עודכנה בהצלחה! מעבירים אתכם לכניסה…','ok');
      setTimeout(function(){ location.href='login.html'; }, 1600);
    }catch(err){
      btn.disabled=false;
      showMsg(err.message || 'לא ניתן לעדכן כעת. ייתכן שהקישור פג תוקף — בקשו קישור חדש מדף הכניסה.');
    }
  }

  // On load: in Supabase mode the recovery link establishes a session automatically.
  // If there's no session, the link is invalid/expired — guide the user back.
  (async function init(){
    var B=await window.PLBackend.ready;
    if(B.isDemo){
      showMsg('מצב הדגמה — שינוי הסיסמה ישמר בדפדפן זה בלבד.','info');
      return;
    }
    try{
      var s=await B.auth.session();
      if(!s){
        document.getElementById('rpForm').classList.add('hide');
        document.getElementById('subText').textContent='הקישור אינו תקף או שפג תוקפו.';
        showMsg('לא זוהתה בקשת איפוס פעילה. חזרו לדף הכניסה ולחצו "שכחתי סיסמה" כדי לקבל קישור חדש.','info');
      }
    }catch(e){}
  })();
</script>
</body>
</html>
