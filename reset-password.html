<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>איפוס סיסמה | Prime Ledger Solutions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0f2440; --navy-2:#16345c; --gold:#c9a14a;
    --bg:#f5f7fa; --card:#ffffff; --text:#1c2b3a; --muted:#5b6b7c;
    --ok:#1d7a4f; --err:#b3362b; --line:#d6dde6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Heebo',sans-serif; background:var(--bg); color:var(--text);
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card{
    background:var(--card); width:100%; max-width:440px; border-radius:14px;
    box-shadow:0 8px 30px rgba(15,36,64,.10); overflow:hidden;
  }
  .card-top{background:linear-gradient(135deg,var(--navy),var(--navy-2)); padding:28px 24px; text-align:center;}
  .card-top .brand{color:#fff; font-weight:800; font-size:20px;}
  .card-top .brand span{color:var(--gold);}
  .card-body{padding:32px 28px 36px;}
  h1{font-size:22px;font-weight:700;margin-bottom:8px;text-align:center;}
  .sub{color:var(--muted);font-size:14px;text-align:center;margin-bottom:24px;line-height:1.6;}
  label{display:block;font-size:14px;font-weight:500;margin-bottom:6px;}
  input{
    width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:8px;
    font-family:inherit;font-size:15px;margin-bottom:16px;direction:ltr;text-align:left;
  }
  input:focus{outline:2px solid var(--navy);outline-offset:1px;border-color:var(--navy);}
  .btn{
    width:100%;background:var(--navy);color:#fff;border:none;padding:13px;border-radius:8px;
    font-family:inherit;font-weight:700;font-size:15px;cursor:pointer;transition:background .2s;
  }
  .btn:hover{background:var(--navy-2);}
  .btn:disabled{opacity:.6;cursor:not-allowed;}
  .msg{margin-top:14px;font-size:14px;text-align:center;line-height:1.6;display:none;}
  .msg.err{display:block;color:var(--err);}
  .msg.ok{display:block;color:var(--ok);}
  .center{text-align:center;}
  .icon{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;font-size:30px;}
  .icon.ok{background:#e7f5ee;color:var(--ok);}
  .icon.err{background:#fbeae8;color:var(--err);}
  .link-btn{
    display:inline-block;margin-top:22px;background:var(--navy);color:#fff;text-decoration:none;
    padding:12px 34px;border-radius:8px;font-weight:700;font-size:15px;
  }
  .hidden{display:none;}
  p{color:var(--muted);font-size:15px;line-height:1.7;}
</style>
</head>
<body>
  <div class="card">
    <div class="card-top"><div class="brand">Prime <span>Ledger</span> Solutions</div></div>
    <div class="card-body">

      <!-- טופס סיסמה חדשה -->
      <div id="state-form">
        <h1>קביעת סיסמה חדשה</h1>
        <p class="sub">בחר סיסמה חדשה לחשבון שלך (לפחות 8 תווים).</p>
        <label for="pw1">סיסמה חדשה</label>
        <input type="password" id="pw1" autocomplete="new-password" placeholder="••••••••">
        <label for="pw2">אימות סיסמה</label>
        <input type="password" id="pw2" autocomplete="new-password" placeholder="••••••••">
        <button class="btn" id="save-btn">עדכון סיסמה</button>
        <div class="msg" id="form-msg"></div>
      </div>

      <!-- הצלחה -->
      <div id="state-success" class="hidden center">
        <div class="icon ok">✓</div>
        <h1>הסיסמה עודכנה!</h1>
        <p>אפשר להתחבר עכשיו עם הסיסמה החדשה.</p>
        <a class="link-btn" id="login-link" href="/">כניסה לחשבון</a>
      </div>

      <!-- קישור לא תקף -->
      <div id="state-error" class="hidden center">
        <div class="icon err">!</div>
        <h1>הקישור אינו תקף</h1>
        <p id="error-msg">הקישור פג תוקף או שכבר נעשה בו שימוש. בקש קישור איפוס חדש ממסך ההתחברות.</p>
        <a class="link-btn" href="/">חזרה לדף הבית</a>
      </div>

    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // ====== הגדרות — שנה רק אם צריך ======
  const LOGIN_URL = "/";   // 👈 שנה לכתובת דף ההתחברות שלך, למשל "/login.html"
  // =====================================

  const supabase = window.supabase.createClient(
    "https://urpzikwromhwtuffkhyr.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVycHppa3dyb21od3R1ZmZraHlyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5Njk4MDEsImV4cCI6MjA5NTU0NTgwMX0.lnnmGDSkQ8hPR0QGP2WnJAhDO2qIZSfJWaXh15c7Obo"
  );

  document.getElementById("login-link").href = LOGIN_URL;

  function show(id){
    ["state-form","state-success","state-error"].forEach(s =>
      document.getElementById(s).classList.toggle("hidden", s !== id)
    );
  }
  function formMsg(text, type){
    const el = document.getElementById("form-msg");
    el.textContent = text; el.className = "msg " + type;
  }

  let hasSession = false;

  async function init(){
    const hash = new URLSearchParams(window.location.hash.substring(1));
    const query = new URLSearchParams(window.location.search);
    const errCode = hash.get("error_code") || query.get("error_code");

    if (errCode) {
      if (errCode === "otp_expired") {
        document.getElementById("error-msg").textContent =
          "הקישור פג תוקף (קישורי איפוס תקפים לזמן מוגבל). בקש קישור חדש ממסך ההתחברות.";
      }
      show("state-error");
      return;
    }

    const { data } = await supabase.auth.getSession();
    if (data.session) hasSession = true;

    supabase.auth.onAuthStateChange((event, session) => {
      if (event === "PASSWORD_RECOVERY" || session) hasSession = true;
    });

    // אם אחרי 4 שניות אין session — הקישור לא תקף
    setTimeout(() => { if (!hasSession) show("state-error"); }, 4000);
  }

  document.getElementById("save-btn").addEventListener("click", async () => {
    const pw1 = document.getElementById("pw1").value;
    const pw2 = document.getElementById("pw2").value;

    if (pw1.length < 8) { formMsg("הסיסמה חייבת להכיל לפחות 8 תווים.", "err"); return; }
    if (pw1 !== pw2)    { formMsg("הסיסמאות אינן תואמות.", "err"); return; }
    if (!hasSession)    { formMsg("הקישור אינו תקף. בקש קישור איפוס חדש.", "err"); return; }

    const btn = document.getElementById("save-btn");
    btn.disabled = true; btn.textContent = "מעדכן...";

    const { error } = await supabase.auth.updateUser({ password: pw1 });

    if (error) {
      btn.disabled = false; btn.textContent = "עדכון סיסמה";
      if (error.message.includes("different from the old")) {
        formMsg("הסיסמה החדשה חייבת להיות שונה מהסיסמה הקודמת.", "err");
      } else {
        formMsg("אירעה שגיאה: " + error.message, "err");
      }
      return;
    }

    await supabase.auth.signOut();
    show("state-success");
  });

  init();
</script>
</body>
</html>
