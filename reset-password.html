<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>איפוס סיסמה · Prime Ledger</title>
<link rel="icon" href="assets/logo-mark.png">
<link rel="stylesheet" href="site.css">
<style>
  body{min-height:100vh}
  .auth{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
  .auth-side{background:var(--grad-ink);color:#fff;padding:56px;display:flex;flex-direction:column;position:relative;overflow:hidden}
  .auth-side::after{content:"";position:absolute;inset-inline-start:-10%;bottom:-10%;width:60%;height:60%;background:radial-gradient(circle,rgba(0,84,168,.4),transparent 70%)}
  .auth-side .brand2{display:flex;align-items:center;gap:11px;position:relative;z-index:1}
  .auth-side .mid{margin-top:auto;position:relative;z-index:1}
  .auth-side h2{font-family:var(--font-display);font-weight:900;font-size:38px;line-height:1.1;margin:0 0 18px}
  .auth-side p{color:rgba(255,255,255,.8);font-size:16px;line-height:1.6}
  .auth-main{display:flex;align-items:center;justify-content:center;padding:40px 40px 72px}
  .auth-card{width:100%;max-width:400px}
  .auth-card h1{font-family:var(--font-display);font-weight:900;font-size:30px;margin:0 0 8px}
  .auth-card .sub{color:var(--ink-3);margin:0 0 26px;font-size:15px}
  .fld{margin-bottom:16px}
  .fld label{display:block;font-size:14px;font-weight:600;color:var(--ink-2);margin-bottom:7px}
  .fld .inp{display:flex;align-items:center;gap:10px;border:1.5px solid var(--border-strong);border-radius:var(--r-md);padding:0 14px;background:var(--surface);transition:all var(--dur)}
  .fld .inp:focus-within{border-color:var(--brand-500);box-shadow:var(--ring-brand)}
  .fld .inp svg{width:18px;height:18px;color:var(--ink-4)}
  .fld .inp input{flex:1;border:none;background:none;font-family:var(--font-sans);font-size:15px;padding:12px 0;outline:none;color:var(--ink)}
  .fld .inp .toggle{background:none;border:none;cursor:pointer;color:var(--ink-4);padding:4px}
  .msg{display:none;align-items:center;gap:9px;font-size:14px;font-weight:600;padding:12px 14px;border-radius:var(--r-md);margin-bottom:18px;line-height:1.4}
  .msg svg{width:18px;height:18px;flex-shrink:0}
  .msg.err{display:flex;background:var(--danger-bg);color:var(--danger);border:1px solid color-mix(in oklab,var(--danger) 30%,transparent)}
  .msg.ok{display:flex;background:var(--success-bg);color:var(--success);border:1px solid color-mix(in oklab,var(--success) 30%,transparent)}
  .loading{text-align:center;padding:40px 0;color:var(--ink-3)}
  @media(max-width:820px){.auth{grid-template-columns:1fr}.auth-side{display:none}}
</style>
</head>
<body>
<div class="auth">
  <div class="auth-side">
    <div class="brand2">
      <span class="logo-mark is-white" style="width:40px;height:36px"></span>
      <b style="font-family:var(--font-display);font-weight:900;font-size:22px">Prime Ledger Solutions</b>
    </div>
    <div class="mid">
      <h2>הגדרת<br>סיסמה חדשה</h2>
      <p>בחרו סיסמה חזקה עם לפחות 6 תווים.<br>אחרי השמירה תועברו לכניסה.</p>
    </div>
  </div>

  <div class="auth-main">
    <div class="auth-card">
      <a class="brand" href="index.html" style="display:flex;align-items:center;gap:10px;margin-bottom:24px">
        <span class="logo-mark" style="width:36px;height:32px"></span>
        <b style="font-family:var(--font-display);font-weight:900;font-size:20px">Prime Ledger Solutions</b>
      </a>

      <div id="loadingState" class="loading">
        <i data-lucide="loader-2" style="animation:spin 1s linear infinite"></i>
        <p>מאמת קישור...</p>
      </div>

      <div id="mainContent" style="display:none">
        <h1>סיסמה חדשה</h1>
        <p class="sub">הזינו את הסיסמה החדשה שלכם</p>

        <div class="msg" id="msg"></div>

        <form id="resetForm" onsubmit="doUpdate(event)">
          <div class="fld">
            <label>סיסמה חדשה</label>
            <div class="inp">
              <i data-lucide="lock"></i>
              <input type="password" id="pw1" placeholder="לפחות 6 תווים" minlength="6" required>
              <button type="button" class="toggle" onclick="togglePw('pw1')"><i data-lucide="eye"></i></button>
            </div>
          </div>
          <div class="fld">
            <label>אישור סיסמה</label>
            <div class="inp">
              <i data-lucide="lock-keyhole"></i>
              <input type="password" id="pw2" placeholder="הקלידו שוב" minlength="6" required>
              <button type="button" class="toggle" onclick="togglePw('pw2')"><i data-lucide="eye"></i></button>
            </div>
          </div>
          <button class="btn btn-primary btn-block btn-lg" type="submit" id="saveBtn" style="margin-top:8px">
            שמירת סיסמה <i data-lucide="check"></i>
          </button>
        </form>
      </div>

      <div id="errorState" style="display:none">
        <div class="msg err" style="display:flex">
          <i data-lucide="alert-circle"></i>
          <span>הקישור פג תוקף או אינו תקף. <a href="login.html" style="color:inherit;text-decoration:underline">בקשו קישור חדש</a>.</span>
        </div>
      </div>

    </div>
  </div>
</div>

<style>
@keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
</style>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
  lucide.createIcons();

  var CFG = window.PL_CONFIG || {};
  var sb = null;

  function showMsg(text, kind) {
    var el = document.getElementById('msg');
    el.className = 'msg ' + (kind || 'err');
    el.innerHTML = '<i data-lucide="' + (kind === 'ok' ? 'check-circle-2' : 'alert-circle') + '"></i><span>' + text + '</span>';
    lucide.createIcons();
  }

  function togglePw(id) {
    var inp = document.getElementById(id);
    inp.type = inp.type === 'password' ? 'text' : 'password';
  }

  // Parse hash params from URL (Supabase sends tokens in hash)
  function parseHash() {
    var hash = window.location.hash.substring(1);
    var params = {};
    hash.split('&').forEach(function(p) {
      var parts = p.split('=');
      if (parts.length === 2) params[decodeURIComponent(parts[0])] = decodeURIComponent(parts[1]);
    });
    return params;
  }

  async function init() {
    var params = parseHash();

    // Check for error in URL
    if (params.error) {
      document.getElementById('loadingState').style.display = 'none';
      document.getElementById('errorState').style.display = 'block';
      lucide.createIcons();
      return;
    }

    // Need Supabase keys
    if (!CFG.SUPABASE_URL || !CFG.SUPABASE_ANON_KEY) {
      document.getElementById('loadingState').style.display = 'none';
      document.getElementById('errorState').style.display = 'block';
      lucide.createIcons();
      return;
    }

    // Init Supabase
    sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);

    // If we have access_token in hash, set the session
    if (params.access_token && params.type === 'recovery') {
      var result = await sb.auth.setSession({
        access_token: params.access_token,
        refresh_token: params.refresh_token || ''
      });
      if (result.error) {
        document.getElementById('loadingState').style.display = 'none';
        document.getElementById('errorState').style.display = 'block';
        lucide.createIcons();
        return;
      }
    } else {
      // Check if already have session (PKCE flow)
      var sessionResult = await sb.auth.getSession();
      if (!sessionResult.data.session) {
        document.getElementById('loadingState').style.display = 'none';
        document.getElementById('errorState').style.display = 'block';
        lucide.createIcons();
        return;
      }
    }

    // Show form
    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('mainContent').style.display = 'block';
    lucide.createIcons();
  }

  async function doUpdate(e) {
    e.preventDefault();
    var pw1 = document.getElementById('pw1').value;
    var pw2 = document.getElementById('pw2').value;

    if (pw1 !== pw2) {
      showMsg('הסיסמאות אינן תואמות. נסו שוב.');
      return;
    }

    var btn = document.getElementById('saveBtn');
    btn.disabled = true;
    btn.textContent = 'שומר...';

    var result = await sb.auth.updateUser({ password: pw1 });

    if (result.error) {
      showMsg('שגיאה בשמירה: ' + result.error.message);
      btn.disabled = false;
      btn.innerHTML = 'שמירת סיסמה <i data-lucide="check"></i>';
      lucide.createIcons();
      return;
    }

    showMsg('הסיסמה עודכנה בהצלחה! מעביר אתכם לכניסה...', 'ok');
    await sb.auth.signOut();
    setTimeout(function() { window.location.href = 'login.html'; }, 2000);
  }

  init();
</script>
</body>
</html>
